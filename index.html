<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的好物分享</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📦 搬家出好物，全部8折</h1>
        <p>搬家出闲置。看中可通过微信联系我，在Montigny-lès-Metz, 小物品可送货到市区。</p>
    </header>
    
    <!-- 商品列表容器 -->
    <main id="product-list" class="grid-container"></main>

    <!-- ======== 新增：全屏图片查看器 (默认隐藏) ======== -->
    <div id="image-modal" class="modal">
        <!-- 关闭按钮 -->
        <span class="close-btn" id="close-modal">&times;</span>
        
        <!-- 左切换按钮 -->
        <button class="nav-btn prev-btn" id="prev-img">&#10094;</button>
        
        <div class="modal-content">
            <img id="modal-image" src="" alt="大图展示">
            <!-- 图片张数指示器，如 1 / 3 -->
            <div id="image-counter" class="counter">1 / 1</div>
        </div>
        
        <!-- 右切换按钮 -->
        <button class="nav-btn next-btn" id="next-img">&#10095;</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
